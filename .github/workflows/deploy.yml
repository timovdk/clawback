# Publishes Clawback to GitHub Pages on every push to main (and when started by hand).
#
# The stop and departure data is refreshed weekly by the data service on the NAS (nas/), which
# uploads it to the R2 bucket the app reads from. The copies in data/ are only the fallback and
# are refreshed by hand (npm run data) now and then.
#
# Setup (once): Settings → Pages → Source: "GitHub Actions".

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update the cat list
        run: python3 scripts/build_cats.py

      - name: Test
        run: npm test

      - name: Collect the files the app needs
        run: |
          mkdir _site
          cp -r index.html style.css manifest.webmanifest icon.svg sw.js LICENSE js vendor data cats icons _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
