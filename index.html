<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clawback</title>
  <meta name="description" content="Clawback: snel een toegankelijkheidsmelding doen bij U-OV. Onafhankelijke app, niet van U-OV.">
  <meta name="theme-color" content="#c8a2c8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#c8a2c8" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Clawback">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Apply the chosen theme before first paint (see Instellingen).
    try {
      var t = (JSON.parse(localStorage.getItem('uov.settings') || '{}').theme) || 'system';
      if (t !== 'system') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <noscript>Deze app heeft JavaScript nodig.</noscript>
  <script src="vendor/mithril.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
